[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsc"
version = "0.1.0"
description = "NetSage CLI"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "rich>=13", "pydantic>=2.7"]

[project.scripts]
nsc = "nsc.main:app"

[tool.setuptools.packages.find]
where = ["."]
