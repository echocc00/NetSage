[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napalm-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0", "napalm>=0.5", "structlog>=24.1", "netsage-mcp-shared"]

[tool.setuptools.packages.find]
where = ["."]
