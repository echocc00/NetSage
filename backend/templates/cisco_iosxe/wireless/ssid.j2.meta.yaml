# cisco_iosxe/wireless/ssid 模板元数据
template_id: cisco_iosxe_wireless_ssid
vendor: cisco
os: iosxe
version_min: "17.0"
version_max: "17.999"
protocol: wireless
feature: ssid
input_schema:
  - { name: ap_name, type: string, required: true }
  - { name: description, type: string, required: false }
  - { name: ap_group_name, type: string, required: true }
  - { name: wlan_id, type: int, required: true }
  - { name: ssid, type: string, required: true }
  - { name: profile_name, type: string, required: true }
  - { name: policy_type, type: string, required: false,
      enum: [wpa2, wpa3], default: wpa2 }
  - { name: session_timeout, type: int, required: true }
  - { name: vlan_id, type: int, required: true }
  - { name: tag_policy_name, type: string, required: true }
  - { name: site_tag_name, type: string, required: true }
  - { name: ssid_auth_mode, type: string, required: true,
      enum: [wpa2-psk, wpa3-sae] }
  - { name: auth_type, type: string, required: true,
      enum: [psk, dot1x] }
  - { name: password, type: string, required: true }
output_format: cli
