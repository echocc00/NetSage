# arista_eos/vpn/ipsec_site2site 模板元数据
template_id: arista_eos_vpn_ipsec_site2site
vendor: arista
os: eos
version_min: "4.24"
version_max: "4.999"
protocol: vpn
feature: ipsec_site2site
input_schema:
  - { name: policy_name, type: string, required: true }
  - { name: sa_strength, type: string, required: true,
      enum: [esp-aes-128-sha1, esp-aes-256-sha1, esp-aes-256-sha256] }
  - { name: pfs_group, type: int, required: true,
      enum: [5, 14, 15] }
  - { name: proposal_id, type: string, required: true }
  - { name: remote_ip, type: string, required: true }
  - { name: local_spi, type: string, required: true }
  - { name: remote_spi, type: string, required: true }
  - { name: proposal_match_info, type: string, required: true,
      desc: "ac/Cryptomap 标识" }
  - { name: sa_lifetime, type: int, required: true,
      desc: "SA 生存时间（秒）" }
  - { name: sa_lifetime_bytes, type: string, required: false,
      desc: "SA 字节数" }
  - { name: interface_name, type: string, required: true }
  - { name: local_ip, type: string, required: true }
  - { name: netmask, type: int, required: true,
      desc: "前缀长度掩码" }
  - { name: remote_subnet, type: string, required: true }
  - { name: remote_mask, type: int, required: true,
      desc: "前缀长度掩码" }
  - { name: next_hop, type: string, required: true }
output_format: cli
validated_against: []
author: "echocc00 · 来源：Arista EOS 4.24 IPsec Configuration"
reviewers: []
