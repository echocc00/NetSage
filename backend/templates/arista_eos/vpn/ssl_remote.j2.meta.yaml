# arista_eos/vpn/ssl_remote 模板元数据
template_id: arista_eos_vpn_ssl_remote
vendor: arista
os: eos
version_min: "4.24"
version_max: "4.999"
protocol: vpn
feature: ssl_remote
input_schema:
  - { name: policy_name, type: string, required: true }
  - { name: cipher_list, type: string, required: true,
      desc: "如 AES256-SHA256:ECDHE-RSA-AES256-GCM-SHA384" }
  - { name: session_cache_timeout, type: int, required: true,
      desc: "秒" }
  - { name: ssl_profile, type: string, required: true }
  - { name: acl_name, type: string, required: true }
  - { name: remote_subnet, type: string, required: true }
  - { name: remote_mask, type: int, required: true }
  - { name: auth_policy_name, type: string, required: true }
  - { name: rule_id, type: int, required: true }
  - { name: user_name, type: string, required: true }
  - { name: radius_server_name, type: string, required: true }
  - { name: radius_ip, type: string, required: true }
  - { name: radius_secret, type: string, required: true }
  - { name: next_hop, type: string, required: true }
output_format: cli
validated_against: []
author: "echocc00 · 来源：Arista EOS 4.24 SSL/TLS Profile Configuration"
reviewers: []
last_reviewed: "2026-08-23"
