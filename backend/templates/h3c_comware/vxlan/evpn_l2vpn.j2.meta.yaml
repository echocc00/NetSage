      desc: "VXLAN VNI" }
  - { name: vsi_interface_id, type: int, required: true,
      desc: "Vsi-interface 编号" }
  - { name: vsi_interface_ip, type: string, required: true,
      desc: "Vsi-interface IP/掩码" }
output_format: cli
