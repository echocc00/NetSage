[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsage-backend"
version = "0.1.0"
description = "NetSage AI 网络工程师智能平台后端"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web 框架
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 数据层
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    # 任务队列
    "celery>=5.4",
    # LLM / Agent
    "litellm>=1.50",
    "langgraph>=0.2",
    # MCP
    "mcp>=1.0",
    # HTTP
    "httpx>=0.27",
    # 认证
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # 日志
    "structlog>=24.1",
    # 配置
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # 行长由 line-length 控制
    "B008",    # FastAPI Depends() 惯用法：函数调用作默认参数
    "E701",    # Protocol stub 的 `def f(): ...` 单行写法
    "UP046",   # PEP695 泛型语法（渐进迁移）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "N802", "C400"]  # 测试：断言中间变量 / 延迟导入 / 命名

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: 集成测试（需 docker-compose）",
    "e2e: 端到端测试（需 Containerlab）",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
