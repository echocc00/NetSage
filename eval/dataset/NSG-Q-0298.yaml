id: NSG-Q-0298
title: 设计 3 层接入 100 园区网 1/10
category: design
vendor: cross
version: ''
difficulty: 4
tags:
- design
- hld
- bom
input:
  symptom: 企业总部 1000 员工，3 层接入 100，采用核心-汇聚-接入三层架构
  device_info:
    model: ''
    version: ''
    interfaces: []
  question: 输出 HLD（拓扑 + IP 规划 + 协议选型）+ BOM
expected_output:
  hld:
    topology: 2 core + 10 agg + 100 access
    core_layer: OSPF
    agg_layer: OSPF area 1
    access_layer: vlan + STP
    ip_plan: core 10.0.0.x/32; agg 10.0.1.x/32; access gateway x.x.x.1/24
    redundancy: HSRP/VRRP gateway 双机
  bom:
  - role: core
    vendor: huawei
    model: CE12808
    qty: 2
  - role: agg
    vendor: huawei
    model: CE6880
    qty: 10
  - role: access
    vendor: huawei
    model: S5731-S48P4X
    qty: 100
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-campus-design
    version: VRP-8.180
    title: 企业园区网参考设计
anti_examples:
- 拓扑无层级
- 无 IP 规划
- 无 BOM
- 缺冗余设计
grading_rubric:
  must_have:
  - 拓扑描述
  - IP 规划
  - underlay/overlay 分离
  - BOM
  nice_to_have:
  - PFC/ECN 调优
  - 多租户 VRF
  - 高可用设计
  penalty:
  - 单点故障设计
  - 无 IP 规划
  - BOM 数字缺
