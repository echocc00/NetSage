id: NSG-Q-0189
title: IPsec IKEv2 EAP 认证失败（华为 VRP-8.180，eap-method 错配）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 4
tags:
- ipsec
- ikev2
- eap
- radius
input:
