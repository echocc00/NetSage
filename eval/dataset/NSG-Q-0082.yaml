id: NSG-Q-0082
title: 生成 huawei bgp/route_reflector 配置 (iBGP Route Reflector 配置，本地 AS 65000 + 集群 ID 10.0.0.1)
category: config
vendor: huawei
version: 8.0+
difficulty: 2
tags:
- bgp
- route_reflector
input:
  symptom: iBGP Route Reflector 配置，本地 AS 65000 + 集群 ID 10.0.0.1
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: "bgp 65000\n  router-id 10.0.0.1\n  #\n  peer 10.0.0.1 reflect-client\n  #\n\n  peer 10.1.1.10 as-number 65000\n  peer 10.1.1.10 group iBGP-RR\n\n#\nipv4-family unicast\n  peer iBGP-RR enable\n  peer iBGP-RR reflect-client\n  peer iBGP-RR\
    \ next-hop-local\n  # reflector cluster-id 配置在 peer 行（华为语法）\n  #\n  undo peer iBGP-RR next-hop-unchanged"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/bgp-route_reflector
    version: '8.0'
anti_examples:
- 漏 bgp 必要字段
- bgp route_reflector 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 bgp/route_reflector 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 huawei_vrp_bgp_route_reflector 必填项
