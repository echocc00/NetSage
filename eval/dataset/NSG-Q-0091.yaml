id: NSG-Q-0091
title: 生成 arista bgp/ipv6_family 配置 (BGP IPv4+IPv6 双栈配置，对端 v4 peer 10.1.1.1 + v6 peer 2001:db8::2)
category: config
vendor: arista
version: 4.24+
difficulty: 2
tags:
- bgp
- ipv6_family
input:
  symptom: BGP IPv4+IPv6 双栈配置，对端 v4 peer 10.1.1.1 + v6 peer 2001:db8::2
  device_info:
    model: generic
    version: 4.24+
  question: 生成命令
expected_output:
  config: "router bgp 65000\n\n  router-id 10.0.0.1\n\n\n  neighbor 10.1.1.1 remote-as 65001\n\n  !\n  address-family ipv4\n\n    neighbor 10.1.1.1 activate\n\n  !\n  address-family ipv6\n\n\n    neighbor 2001:db8::2 activate\n"
  references:
  - type: vendor_doc
    url: https://support.arista.com/bgp-ipv6_family
    version: '4.24'
anti_examples:
- 漏 bgp 必要字段
- bgp ipv6_family 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 bgp/ipv6_family 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 arista_eos_bgp_ipv6_family 必填项
