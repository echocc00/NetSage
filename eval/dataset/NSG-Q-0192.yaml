id: NSG-Q-0192
title: DHCP snooping 阻断合法用户（思科 IOS-XE 17，trust interface 错配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- dhcp
- snooping
- trust
input:
  symptom: DHCP 客户端获取不到 IP
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: 'ip dhcp snooping

      ip dhcp snooping vlan 10'
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: DHCP server 接口未配 trust
    probability: 0.7
    evidence: []
    verify: show ip dhcp snooping binding
    fix: 上行接口 dhcp snooping trust
  - rank: 2
    cause: option 82 中间设备封装丢
    probability: 0.3
    evidence: []
    verify: show ip dhcp snooping statistics
    fix: 关闭 option 82
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/dhcp-snooping
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 dhcp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
