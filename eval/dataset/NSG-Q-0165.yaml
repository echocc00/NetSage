id: NSG-Q-0165
title: OSPF 卡 EXSTART Cisco（思科 DD 重传）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ospf
- exstart
- dd
- retransmit
input:
  symptom: OSPF卡 EXSTART反复 retry
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface g1/0/1\n ip ospf mtu-ignore   # ⚠️ 忽略 MTU"
  question: 诊断 EXSTART 重传
expected_output:
  root_causes:
  - rank: 1
    cause: ip ospf mtu-ignore 配合不当，导致 DBD 反复
    probability: 0.6
    verify: show ip ospf interface g1/0/1 | include MTU
    fix: no ip ospf mtu-ignore
  - rank: 2
    cause: 链路噪声大
    probability: 0.4
    verify: show interface | include error
    fix: 查物理层
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ospf-mtu-ignore
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospf
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
