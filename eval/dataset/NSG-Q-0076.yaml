id: NSG-Q-0076
title: 生成华为 USG IPsec site-to-site 配置（AES256+SHA256）
category: config
vendor: huawei
version: VRP-8.180
difficulty: 4
tags:
- ipsec
- site-to-site
- ikev1
input:
  symptom: 某 Huawei USG 6680 与对端 10.1.2.1 建 IPsec 隧道（pre-share-key "NetSys@2024"），保护 10.0.1.0/24 ↔ 10.0.2.0/24
  device_info:
    model: USG 6680
    version: VRP-8.180
  question: 生成 IPsec site-to-site 配置
expected_output:
  config: "ike proposal 1\n encryption-algorithm aes-cbc-256\n authentication-algorithm pre-share\n integrity-algorithm sha2-256\n dh group14\n#\nike peer peer1\n pre-shared-key cipher NetSys@2024\n remote-address 10.1.2.1\n ike-proposal 1\n\
    #\nipsec proposal prop1\n encapsulation-mode tunnel\n esp authentication-algorithm sha2-256\n esp encryption-algorithm aes-cbc-256\n#\nipsec policy pol1 1 isakmp\n security acl 3000\n ike-peer peer1\n proposal prop1\n#\nacl 3000\n rule 5\
    \ permit ip source 10.0.1.0 0.0.0.255 destination 10.0.2.0 0.0.0.255\n#\ninterface 10GE1/0/1\n ip address 198.51.100.1 255.255.255.0\n ipsec policy pol1\n#\nip route-static 10.0.2.0 255.255.255.0 198.51.100.254\n"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-ipsec-site2site
    version: VRP-8.180
anti_examples:
- 漏 acl 感兴趣流
- proposal esp 与 ike proposal 名称冲突
- 忘了应用 ipsec policy 在接口上
grading_rubric:
  must_have:
  - ike proposal
  - ike peer
  - ipsec proposal
  - ipsec policy isakmp
  - acl 感兴趣流
  - 接口应用
  - static-route
  nice_to_have:
  - DH group 14 一致
  - pre-shared-key
  penalty:
  - 漏 acl
  - 漏接口应用
  - algo 与对端不一
