id: NSG-Q-0347
title: 设计 BGP multi-homing 4/6
category: design
vendor: cross
version: ''
difficulty: 4
tags:
- design
- hld
- bom
input:
  symptom: 企业出口 BGP 多宿主 to 5 ISP
  device_info:
    model: ''
    version: ''
    interfaces: []
  question: 输出 HLD（拓扑 + IP 规划 + 协议选型）+ BOM
expected_output:
  hld:
    topology: BGP multi-homing 2 ISP
    as_number: 65003
    bgp_policy: transit AS 65000 + 2 eBGP to ISP
    route_announce: 10.0.0.0/8 + 长前缀部分
  bom:
  - role: border
    vendor: huawei
    model: NE40E-X16
    qty: 2
  references:
  - type: rfc
    url: https://datatracker.ietf.org/doc/html/rfc4271
