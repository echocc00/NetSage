id: NSG-Q-0446
title: BGP ADD-PATH 协商失败（Arista EOS 4.24）
category: troubleshoot
vendor: arista
version: '4.24'
difficulty: 4
tags:
- bgp
- add-path
- receive
input:
  symptom: BGP ADD-PATH 多路径不通
  device_info:
    model: ''
    version: '4.24'
    interfaces: []
  evidence:
  - config_snippet: "router bgp 65001\n address-family ipv4\n  neighbor 10.1.1.2 activate\n  # ⚠️ 漏 add-path"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: ADD-PATH capability 未协商
    probability: 0.7
    evidence: []
    verify: show ip bgp neighbors 10.1.1.2 | include add-path
    fix: 配 add-path
  - rank: 2
    cause: 对端不支持
    probability: 0.3
    evidence: []
    verify: show ip bgp 10.1.1.2
    fix: 统一 add-path
  references:
  - type: vendor_doc
    url: https://www.arista.com/en/docs/eos-4.24/bgp-add-path
    version: EOS 4.24
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
