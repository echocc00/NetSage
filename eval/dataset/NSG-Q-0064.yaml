id: NSG-Q-0064
title: IPv4 ACL 包统计为 0（华为 VRP-8.180，traffic-filter 应用方向错）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 2
tags:
- acl
- packet-filter
- traffic-statistics
input:
  symptom: ACL 匹配数为 0，但流量实际全通
  device_info:
    model: CE5880
    version: VRP-8.180
  evidence:
  - config_snippet: "acl 3000\n  rule 10 deny ip source 192.168.1.0 0.0.0.255\n# 应 apply 在入接口\ninterface 10GE1/0/1\n  traffic-filter outbound acl 3000  # ⚠️ 这里是源 IP 应用 outbound 错方向"
  - log_lines:
    - 'display traffic-filter applied-record: hits 0'
  question: 诊断 + 修复
expected_output:
  root_causes:
  - rank: 1
    cause: traffic-filter outbound 配错方向（应 inbound 匹配 source）
    probability: 0.7
    evidence:
    - hits 0
    verify: 'display acl 3000

      display traffic-filter applied-record'
    fix: "interface 10GE1/0/1\n  undo traffic-filter outbound acl 3000\n  traffic-filter inbound acl 3000"
    rollback: undo traffic-filter inbound
  - rank: 2
    cause: ACL rule 反掩码错
    probability: 0.2
    verify: display acl 3000
    fix: "acl 3000\n  rule 10 deny ip source 192.168.1.0 0.0.0.255"
  - rank: 3
    cause: 其他位置已 permit
    probability: 0.1
    verify: display acl 3000
    fix: 在 rule 10 后加更精细规则
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-acl
    version: VRP-8.180
anti_examples:
- 请重启
- 删除 ACL
- 关闭接口
grading_rubric:
  must_have:
  - 诊断方向错（outbound）
  - 修复 inbound
  nice_to_have:
  - 反掩码检查
  penalty:
  - 重启
