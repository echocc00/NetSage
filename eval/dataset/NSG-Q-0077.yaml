id: NSG-Q-0077
title: 生成 huawei bgp/peering 配置 (eBGP peer 建立，与对端 AS 65001 互联)
category: config
vendor: huawei
version: 8.0+
difficulty: 2
tags:
- bgp
- peering
input:
  symptom: eBGP peer 建立，与对端 AS 65001 互联
  device_info:
