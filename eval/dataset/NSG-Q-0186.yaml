id: NSG-Q-0186
title: IPv6 BGP AFI 警告（思科 IOS-XE 17，neighbor ipv6 不在 family 内）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 4
tags:
- bgp
- ipv6
- afi
input:
  symptom: IPv6 BGP peer OpenConfirm 但未收到 update
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "router bgp 65001\n neighbor 2001:db8::2 remote-as 65002"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: address-family ipv6 unicast 未配 activate
    probability: 0.85
    evidence: []
    verify: show ip bgp summary
    fix: address-family ipv6 unicast → neighbor 2001:db8::2 activate
  - rank: 2
    cause: IPv6 单播路由被压制
    probability: 0.15
    evidence: []
    verify: show ipv6 route
    fix: ipv6 unicast-routing 启用
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/bgp-ipv6-afi
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
