id: NSG-Q-0441
title: IPv6 路由通告 ISP 受阻（华三 Comware 7，filter 配错）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 4
tags:
- ipv6
- filter
- bgp-export
input:
