id: NSG-Q-0158
title: BGP maximum-prefix 超限（华三 Comware 7）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 3
tags:
- bgp
- maximum-prefix
- shutdown
input:
  symptom: '%@BGPN/3/STATECHG: Peer(10.1.1.2) -> Idle (exceeded maximum-prefix)'
  device_info:
    model: ''
    version: Comware-7.1.070
    interfaces: []
  evidence:
  - config_snippet: "bgp 65001\n peer 10.1.1.2 as-number 65002\n peer 10.1.1.2 maximum-prefix 1000 80"
  - config_snippet: '%@BGPN/3/STATECHG(l): Peer(10.1.1.2) -> Idle (exceeded max-prefix)'
  question: 诊断 maximum-prefix 触发
expected_output:
  root_causes:
  - rank: 1
    cause: 路由泄漏
    probability: 0.7
    verify: display bgp routing-table statistics
    fix: bgp 65001 → undo peer x maximum-prefix → peer y maximum-prefix 5000
  - rank: 2
    cause: Prefix 被 attacker 重写
    probability: 0.3
    verify: display filter-policy
    fix: ip-prefix 过滤
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/bgp-maximum-prefix
    version: Comware 7.1.070
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
