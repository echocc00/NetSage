id: NSG-Q-0068
title: IPv6 邻居 cache 频繁失效（Cisco IOS-XE 17，ND timer 抖动）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ipv6
- nd
- neighbor-cache
input:
  symptom: show ipv6 neighbors 频繁变化（incomplete 占比高）
  device_info:
    model: ASR 1001-X
    version: IOS-XE 17.09.04a
  evidence:
  - config_snippet: '# interface 配置 RS 频繁

      ipv6 nd cache expire 60  # ⚠️ 太短'
  - log_lines:
    - 'show ipv6 neighbors: state=incomplete 30%'
  question: 诊断 + 修复
expected_output:
  root_causes:
  - rank: 1
    cause: ipv6 nd cache expire 设太短（60s）
    probability: 0.65
    evidence:
    - incomplete state 高
    verify: show ipv6 interface g1/0/24 | include expire
    fix: "interface g1/0/24\n  ipv6 nd cache expire 14400  # 4 小时更稳"
    rollback: no ipv6 nd cache expire
  - rank: 2
    cause: 链路质量差
    probability: 0.25
    verify: show interface | include CRC
    fix: 更换光模块 / 物理链路
  - rank: 3
    cause: ND PREFIX 缺失
    probability: 0.1
    verify: show ipv6 interface | include RA
    fix: ipv6 nd prefix-advertisement 2001:db8::/64 24000 12000
  references:
  - type: rfc
    url: https://datatracker.ietf.org/doc/html/rfc4861
    title: ND
anti_examples:
- 请重启
- 关 IPv6 routing
- disable neighbors cache
grading_rubric:
  must_have:
  - 诊断 nd cache expire 短
  - 修复 14400s
  nice_to_have:
  - ND prefix 检查
  penalty:
  - 关 IPv6
