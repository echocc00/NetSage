id: NSG-Q-0112
title: 生成 huawei vxlan/anycast_gateway 配置 (VXLAN anycast-gateway VNI 10020，统一网关 MAC)
category: config
vendor: huawei
version: 8.180+
difficulty: 2
tags:
- vxlan
- anycast_gateway
input:
  symptom: VXLAN anycast-gateway VNI 10020，统一网关 MAC
  device_info:
    model: generic
    version: 8.180+
  question: 生成命令
expected_output:
  config: "evpn-overlay enable\nbridge-domain 20\n  vxlan vni 10020\ninterface Vbdif20\n  ip address 10.1.20.1/24\n  arp collect host\n  vxlan anycast-gateway enable\n  #\n  evpn anycast-gateway local-mac 00-00-5e-00-01-20"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vxlan-anycast_gateway
    version: '8.180'
anti_examples:
- 漏 vxlan 必要字段
- vxlan anycast_gateway 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 vxlan/anycast_gateway 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 huawei_vrp_vxlan_anycast_gateway 必填项
