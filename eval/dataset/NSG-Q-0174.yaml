id: NSG-Q-0174
title: OSPF 默认路由缺失（Arista EOS 4.24，default-information originate 漏配）
category: troubleshoot
vendor: arista
version: '4.24'
difficulty: 3
tags:
- ospf
- default-information
- stub
input:
  symptom: OSPF stub 区无默认路由
  device_info:
    model: ''
    version: '4.24'
    interfaces: []
  evidence:
  - config_snippet: "router ospf 1\n area 0.0.0.1 stub\n# ⚠️ ABR 上未加 default-information originate"
  question: 诊断 default-information
expected_output:
  root_causes:
  - rank: 1
    cause: ABR 漏 default-information originate
    probability: 0.85
    verify: show ip ospf database
    fix: area 0.0.0.1 default-information originate
  - rank: 2
    cause: metrics 设错
    probability: 0.15
    verify: show ip ospf
    fix: area stub 默认 cost 1
  references:
  - type: vendor_doc
    url: https://www.arista.com/en/docs/eos-4.24/ospf-default
    version: EOS 4.24
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospf
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
