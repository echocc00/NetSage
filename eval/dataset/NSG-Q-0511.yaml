id: NSG-Q-0511
title: '生成 juniper vxlan/evpn_l2vpn 配 (变体 #57): Juniper VXLAN BD 50'
category: config
vendor: juniper
version: 8.0+
difficulty: 2
tags:
- vxlan
- evpn_l2vpn
input:
  symptom: Juniper VXLAN BD 50
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: 'set routing-instances evpn-50 instance-type evpn

    set routing-instances evpn-50 vlan-id 50

    set routing-instances evpn-50 l3vpn no

    set routing-instances evpn-50 vxlan vni 10050

    set routing-instances evpn-50 protocols evpn encapsulation vxlan

    set routing-instances evpn-50 protocols evpn control-plane bgp

    set routing-instances evpn-50 route-distinguisher 10.0.0.1:50

    set routing-instances evpn-50 vrf-target target:65000:10050

    !

    set protocols bgp group RR family evpn signaling

    set protocols bgp group RR neighbor 10.1.1.1

    set protocols bgp group RR local-address 10.0.0.1'
  references:
  - type: vendor_doc
    url: https://juniper.com/vxlan-evpn_l2vpn
    version: 8.0+
anti_examples:
- 漏 vxlan 必要字段
- vxlan evpn_l2vpn 缩进错乱
grading_rubric:
  must_have:
  - 包含 vxlan/evpn_l2vpn 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_vxlan_evpn_l2vpn 必填项
