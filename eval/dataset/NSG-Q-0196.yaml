id: NSG-Q-0196
title: 环路震荡（思科 MSTP，思科 Spanning-tree 实例错配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- stp
- mstp
- instance
- loop
input:
  symptom: 环路引发 ping 抖动
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "spanning-tree mode mst\nspanning-tree mst configuration\n  name REGION1\n  instance 1 vlan 10"
