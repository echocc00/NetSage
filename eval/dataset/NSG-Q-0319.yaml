id: NSG-Q-0319
title: 设计多租户 10 数据中心
category: design
vendor: cross
version: ''
difficulty: 4
tags:
- design
- hld
- bom
input:
  symptom: 新建数据中心承载 100 租户，VRF + VXLAN 分租户
  device_info:
    model: ''
    version: ''
    interfaces: []
  question: 输出 HLD（拓扑 + IP 规划 + 协议选型）+ BOM
expected_output:
  hld:
    topology: spine-leaf 4+8 双 fabric
    underlay: OSPF + ECMP
    overlay: BGP EVPN VXLAN + VRF
    ip_plan: tenant-9 VRF vrf-9; VRF Target 65000:1000
    multi_tenant: 10 租户 / VRF 隔离 / PIM SM / DHCP Relay per VRF
  bom:
  - role: spine
    vendor: huawei
    model: CE12808
    qty: 4
  - role: leaf
    vendor: huawei
    model: CE6880
    qty: 8
  - role: border-leaf
    vendor: huawei
    model: CE12800
    qty: 2
  references:
  - type: standard
    url: https://www.rfc-editor.org/rfc/rfc7938
    version: RFC 7938
    title: VPLS/BGP VPN 多租户
anti_examples:
- 拓扑无层级
- 无 IP 规划
- 无 BOM
- 缺冗余设计
grading_rubric:
  must_have:
  - 拓扑描述
  - IP 规划
  - underlay/overlay 分离
  - BOM
  nice_to_have:
  - PFC/ECN 调优
  - 多租户 VRF
  - 高可用设计
  penalty:
  - 单点故障设计
  - 无 IP 规划
  - BOM 数字缺
