    \ connect-interface LoopBack0\n\n  address-family l2vpn evpn\n\n    peer 10.1.1.1 enable\n"
  references:
  - type: vendor_doc
    url: https://support.h3c.com/vxlan-evpn_l2vpn
    version: 7.1.070
anti_examples:
- 漏 vxlan 必要字段
- vxlan evpn_l2vpn 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 vxlan/evpn_l2vpn 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 h3c_comware_vxlan_evpn_l2vpn 必填项
