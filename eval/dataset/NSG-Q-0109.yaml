id: NSG-Q-0109
title: 生成 h3c vxlan/evpn_l2vpn 配置 (VXLAN EVPN L2VNI 10010 + BGP EVPN peer)
category: config
vendor: h3c
version: 7.1.070+
difficulty: 2
tags:
- vxlan
- evpn_l2vpn
input:
  symptom: VXLAN EVPN L2VNI 10010 + BGP EVPN peer
  device_info:
    model: generic
    version: 7.1.070+
  question: 生成命令
expected_output:
