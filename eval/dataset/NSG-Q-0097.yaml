id: NSG-Q-0097
title: 生成 huawei ospf/interface 配置 (OSPF 接口配置 + 网络类型 broadcast)
category: config
vendor: huawei
version: 8.0+
difficulty: 2
tags:
- ospf
- interface
input:
  symptom: OSPF 接口配置 + 网络类型 broadcast
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: "interface 10GE1/0/1\n  ospf enable 1 area 0.0.0.0\n  ospf network-type broadcast\n  ospf cost 1\n"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/ospf-interface
    version: '8.0'
anti_examples:
- 漏 ospf 必要字段
- ospf interface 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 ospf/interface 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 huawei_vrp_ospf_interface 必填项
