id: NSG-Q-0127
title: 生成 huawei interface/trunk 配置 (Trunk 端口 VLAN 10 配置)
category: config
vendor: huawei
version: 8.0+
difficulty: 2
tags:
- interface
- trunk
input:
  symptom: Trunk 端口 VLAN 10 配置
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: "vlan 10\n#\ninterface 10GE1/0/1\n  port link-type trunk\n  port trunk allow-pass vlan 10\n\n  port trunk pvid vlan 1\n\n  undo port trunk allow-pass vlan 1"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/interface-trunk
    version: '8.0'
anti_examples:
- 漏 interface 必要字段
- interface trunk 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 interface/trunk 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 huawei_vrp_interface_trunk 必填项
