id: NSG-Q-0442
title: OSPF 缺 summary LSA（RDF+LSA）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ospf
- summary
- lsa
- area-range
input:
  symptom: 区域间 summary 路由缺失
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "router ospf 1\n area 0.0.0.1 range 10.1.0.0 255.255.0.0  # ⚠️ 错配 mask"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: wildcard mask 设错
    probability: 0.7
    evidence: []
    verify: show ip ospf database summary
    fix: area range 10.1.0.0 255.255.0.0
  - rank: 2
    cause: LSA flooding 受限
    probability: 0.3
    evidence: []
    verify: show ip ospf neighbor
    fix: 查邻居稳定性
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ospf-summary
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospf
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
