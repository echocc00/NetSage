id: NSG-Q-0426
title: IPv6 OSPFv3 路由选路错（思科 IOS-XE 17）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ospfv3
- ipv6
- selection
input:
  symptom: IPv6 OSPFv3 不优选
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface g1/0/1\n ipv6 ospf cost 100\n # ⚠️ cost 应低"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: cost 设过大
    probability: 0.7
    evidence: []
    verify: show ipv6 ospf interface
    fix: ipv6 ospf cost 10
  - rank: 2
    cause: 参考带宽错配
    probability: 0.3
    evidence: []
    verify: show ipv6 ospf
    fix: ipv6 ospf reference-bandwidth 1000000
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ospfv3-cost
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospfv3
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
