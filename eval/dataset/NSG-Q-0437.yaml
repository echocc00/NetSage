id: NSG-Q-0437
title: EVPN Symmetric IRB 不通（Juniper Mist）
category: troubleshoot
vendor: juniper
version: 21.2R1
difficulty: 4
tags:
- evpn
- symmetric-irb
input:
  symptom: EVPN IRB 流量不通
  device_info:
    model: ''
    version: 21.2R1
    interfaces: []
  evidence:
  - config_snippet: "set routing-instances anycast-gw instance-type virtual-switch\n set routing-instances anycast-gw interface irb.20"
  question: 诊断修复
expected_output:
