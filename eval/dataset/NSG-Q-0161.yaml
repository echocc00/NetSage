id: NSG-Q-0161
title: BGP 路由频繁 flap（华为 VRP-8.180，aggregator 抖动）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 3
tags:
- bgp
- route-flap
- aggregate
input:
  symptom: BGP 路由 192.168.0.0/16 频繁 Up/Down
  device_info:
    model: ''
    version: VRP-8.180
    interfaces: []
  evidence:
  - config_snippet: "bgp 65001\n aggregate 192.168.0.0 255.255.0.0 detail-suppressed\n network 192.168.1.0 255.255.255.0\n network 192.168.2.0 255.255.255.0"
  - config_snippet: '%BGP-5-CHANGE: Peer state Open -> Established -> Open反复'
  question: 诊断 route flap
expected_output:
  root_causes:
  - rank: 1
    cause: 被 aggregate 的子网频繁撤回（上游 IGP 抖动）
    probability: 0.6
    verify: display bgp routing-table flap-info
    fix: aggregate 关闭 + static 注入 static-route
  - rank: 2
    cause: BGP dampening 未启用
    probability: 0.3
    verify: display bgp dampening
    fix: dampening 启用
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-bgp-aggregate
    version: VRP-8.180
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
