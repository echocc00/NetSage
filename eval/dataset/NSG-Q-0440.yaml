id: NSG-Q-0440
title: BGP RFC 9234 错误处理（思科 IOS-XE 17，external-path-attrib）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 4
tags:
- bgp
- rfc9234
- path-attribute
input:
  symptom: BGP 路由不优
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "router bgp 65001\n neighbor 10.1.1.2 attribute-unchanged  # ⚠️ 新 RFC 9234 违例"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: RFC 9234 错过
    probability: 0.7
    evidence: []
    verify: show bgp neighbors 10.1.1.2 | include attribute-unchanged
    fix: 不配 attribute-unchanged
  - rank: 2
    cause: 对端 BGP v4
    probability: 0.3
    evidence: []
    verify: show bgp summary
    fix: 统一 BGP 模式
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/bgp-rfc9234
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
