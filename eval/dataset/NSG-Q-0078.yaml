id: NSG-Q-0078
title: 生成 cisco bgp/peering 配置 (eBGP peer 建立，与对端 AS 65001 互联)
category: config
vendor: cisco
version: 17.0+
difficulty: 2
tags:
- bgp
- peering
input:
  symptom: eBGP peer 建立，与对端 AS 65001 互联
  device_info:
    model: generic
    version: 17.0+
  question: 生成命令
expected_output:
  config: "router bgp 65000\n bgp router-id 10.0.0.1\n\n neighbor 10.1.1.1 remote-as 65001\n\n\n!\n address-family ipv4 unicast\n\n  neighbor 10.1.1.1 activate\n\n\n  redistribute static\n\n exit-address-family"
  references:
  - type: vendor_doc
    url: https://support.cisco.com/bgp-peering
    version: '17.0'
anti_examples:
- 漏 bgp 必要字段
- bgp peering 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 bgp/peering 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 cisco_iosxe_bgp_peering 必填项
