id: NSG-Q-0003
title: "OSPF area 0 配置生成（华为 VRP）"
category: config
vendor: huawei
version: VRP-8.180
difficulty: 2
tags: [ospf, area]

input:
  symptom: "设备加入 OSPF area 0，router-id 1.1.1.1，通告 10.0.0.0/8（wildcard 255.0.0.0）和 192.168.1.0/24（wildcard 0.0.0.255）。"
  device_info:
    model: CE12800
    version: VRP-8.180
  question: "生成 OSPF 配置（含 network 通告与 router-id）"

expected_output:
  config: |
    ospf 1 router-id 1.1.1.1
      area 0.0.0.0
        network 10.0.0.0 255.0.0.0
        network 192.168.1.0 0.0.0.255
  references:
    - type: vendor_doc
      url: https://support.huawei.com/ospf
      version: VRP-8.180

anti_examples: ["用 Cisco 的反掩码语法（VRP network 用 wildcard，注意 10.0.0.0 应为 255.0.0.0）"]

grading_rubric:
  must_have:
    - "ospf 进程 + router-id"
    - "area 声明"
    - "两条 network 通告"
  nice_to_have:
    - "silent-interface 建议"
  penalty:
    - "wildcard 计算错误"
