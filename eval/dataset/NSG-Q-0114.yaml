id: NSG-Q-0114
title: 生成 h3c vxlan/anycast_gateway 配置 (VXLAN anycast-gateway VNI 10020，统一网关 MAC)
category: config
vendor: h3c
version: 7.1.070+
difficulty: 2
tags:
- vxlan
- anycast_gateway
input:
