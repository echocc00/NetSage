    fix: undo stub no-summary → stub
  - rank: 2
    cause: ABR 上 area-range 误配
    probability: 0.15
    verify: display ospf abr
    fix: 调整 area-range
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/ospf-stub-summary
