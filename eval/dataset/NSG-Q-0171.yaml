id: NSG-Q-0171
title: OSPF ABR 不通告 type-3 summary（华三 Comware 7）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 3
tags:
- ospf
- abr
- summary
- nssa
input:
  symptom: OSPF ABR 不通告某些 inter-area route
  device_info:
    model: ''
    version: Comware-7.1.070
    interfaces: []
  evidence:
  - config_snippet: "ospf 1\n area 0.0.0.1\n  stub no-summary  # ⚠️ 完全末梢"
  question: 诊断 type-3 summary 缺
expected_output:
