id: NSG-Q-0027
title: OSPF 区域不连续（华三 Comware 7，area 0 中断）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 4
tags:
- ospf
- area-0
- discontiguous
- virtual-link
input:
  symptom: OSPF display ospf 提示 'Area 0 not backbone'
  device_info:
    model: S6850-56HF
    version: Comware 7.1.070
  evidence:
  - log_lines:
    - 'OSPF-1-NOTAREA0: This OSPF process has area 1 not connected to area 0'
    - 'display ospf peer: area 1 area 0.0.0.1'
    - 拓扑：两台设备 area 0.0.0.1 通过 area 0.0.0.2 互联，area 0 不连续
  question: 诊断 + 验证 + 修复；解释不连续 area 0 处理：虚链路 / 重新规划。
expected_output:
  root_causes:
  - rank: 1
    cause: OSPF area 设计不规范（area 0 不连续、被 area 1/2 隔离）
    probability: 0.8
    evidence:
    - 拓扑中 area 0 中间被 area 1/2 隔开；NOTAREA0 告警
    verify: display ospf peer; display ospf abr
    fix: "# 方案 A：建立 OSPF 虚链路（最简单，不需重新布线）\n# 在隔离 area 0 的 ABR 上做：\n# 设备 A (area 0 ABR)，设备\
      \ B (area 0 ABR 通过 transit area X 互联)\n# A:\nospf 1\n  area 0.0.0.1\n    vlink-peer\
      \ 10.0.0.2\n# B:\nospf 1\n  area 0.0.0.1\n    vlink-peer 10.0.0.1\n# 方案 B（推荐）：重新规划\
      \ area，area 0 单独跑到 transit\n"
    rollback: undo area 0.0.0.1; undo vlink-peer
  - rank: 2
    cause: area 0 上一台 ABR 误配变成 stub
    probability: 0.15
    verify: display current-configuration configuration ospf | include stub
    fix: undo stub
  - rank: 3
    cause: BGP/MPLS L3VPN 上 OSPF 区域设计错误（如 sham-link 缺配）
    probability: 0.05
    verify: display ospf sham-link
    fix: 配置 sham-link
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/1506893_483005_0.htm
    version: Comware 7.1.070
    title: OSPF 虚链路
  - type: rfc
    url: https://datatracker.ietf.org/doc/html/rfc2328#section-10.1
    title: OSPF Area 0 requirement
anti_examples:
- 请重启
- 删除 OSPF
grading_rubric:
  must_have:
  - 明确解释 area 0 不连续的根本原因与虚链路解决方案
  penalty:
  - 推荐重启整机
