id: NSG-Q-0413
title: BGP 路由不优（华为 VRP-8.180，confederation 配错）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 4
tags:
- bgp
- confederation
- sub-as
input:
  symptom: BGP 路由不优
  device_info:
    model: ''
    version: VRP-8.180
    interfaces: []
  evidence:
  - config_snippet: "bgp 65001\n confederation id 65000\n confederation peer-as 65002  # sub-as 间也需配 peer"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: confederation sub-as 配错
    probability: 0.7
    evidence: []
    verify: display bgp peer
    fix: undo confederation peer-as → 重新配
  - rank: 2
    cause: router-id 冲突
    probability: 0.3
    evidence: []
    verify: display bgp router-id
    fix: 重配 router-id
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-bgp-confederation
    version: VRP-8.180
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
