id: NSG-Q-0211
title: BFD+OSPF 抖动（思科 IOS-XE 17，bfd interval 错配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- bfd
- ospf
- interval
input:
  symptom: BFD+OSPF 反复 flap
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface g1/0/1\n ip ospf bfd\n bfd interval 50"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: bfd interval 太短 (50ms)
    probability: 0.7
    evidence: []
    verify: show bfd neighbor
    fix: bfd interval 500 min_rx 500 multiplier 3
  - rank: 2
    cause: 链路抖动导致 bfd 触 flap
    probability: 0.3
    evidence: []
    verify: show interface
    fix: 修物理链路
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/bfd-ospf
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bfd
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
