id: NSG-Q-0514
title: '生成 juniper interface/trunk 配 (变体 #60): Juniper trunk vlan 1,50,100'
category: config
vendor: juniper
version: 8.0+
difficulty: 2
tags:
- interface
- trunk
input:
  symptom: Juniper trunk vlan 1,50,100
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: 'set interfaces xe-0/0/1 unit 0 vlan-id-list 100

    set interfaces xe-0/0/1 unit 0 family ethernet-switching interface-mode trunk


    set interfaces xe-0/0/1 unit 0 native-vlan-id 1'
  references:
  - type: vendor_doc
    url: https://juniper.com/interface-trunk
    version: 8.0+
anti_examples:
- 漏 interface 必要字段
- interface trunk 缩进错乱
grading_rubric:
  must_have:
  - 包含 interface/trunk 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_interface_trunk 必填项
