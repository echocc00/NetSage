id: NSG-Q-0331
title: 设计 OSPF 多区域 4/8
category: design
vendor: cross
version: ''
difficulty: 4
tags:
- design
- hld
- bom
input:
  symptom: 企业网 OSPF 7 区域 stub/totally-stub/NSSA
  device_info:
    model: ''
    version: ''
    interfaces: []
  question: 输出 HLD（拓扑 + IP 规划 + 协议选型）+ BOM
expected_output:
  hld:
    topology: OSPF multi-area 0+1+2+3
    area_design: area 0 backbone; area 1 stub; area 2 totally stub; area 3 NSSA
    redundancy: OSPF 双 ABR 互为 backup
    summarization: 每个 area 各 1 个 summary LSA
  bom:
  - role: core
    vendor: huawei
    model: NE40E-X8
    qty: 2
  - role: aggr
    vendor: huawei
    model: AR 6140
    qty: 8
  references:
  - type: rfc
    url: https://datatracker.ietf.org/doc/html/rfc2328
    version: OSPFv2
    title: OSPF
anti_examples:
- 拓扑无层级
- 无 IP 规划
- 无 BOM
- 缺冗余设计
grading_rubric:
  must_have:
  - 拓扑描述
  - IP 规划
  - underlay/overlay 分离
  - BOM
  nice_to_have:
  - PFC/ECN 调优
  - 多租户 VRF
  - 高可用设计
  penalty:
  - 单点故障设计
  - 无 IP 规划
  - BOM 数字缺
