id: NSG-Q-0176
title: VTEP IP 不互通（华三 Comware 7，Loopback 接口 IP 不一致）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 4
tags:
- vxlan
- vtep
- loopback
- bgp
input:
  symptom: VXLAN VTEP peer 不可达
  device_info:
    model: ''
    version: Comware-7.1.070
    interfaces: []
  evidence:
  - config_snippet: "# Spine\ninterface Loopback0\n ip address 10.0.0.1 32\nbgp 65000\n  peer 10.0.0.2 as 65000   # ⚠️ 对端 loopback 是 10.0.0.100"
  question: 诊断 VTEP loopback 错配
expected_output:
  root_causes:
  - rank: 1
    cause: Spine 配 10.0.0.2 但对端是 10.0.0.100
    probability: 0.7
    verify: display bgp peer
    fix: 统一 loopback 地址
  - rank: 2
    cause: Loopback 接口 down
    probability: 0.3
    verify: display interface Loopback0
    fix: undo shutdown
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/vtep-loopback
    version: Comware 7.1.070
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 vxlan
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
