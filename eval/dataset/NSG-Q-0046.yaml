id: NSG-Q-0046
title: OSPF 卡 Init 状态（华三 Comware 7，area ID 不一致 + 认证 MD5 错配）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 3
tags:
- ospf
- init
- area-id
- md5
input:
  symptom: OSPF 卡 Init，邻居不进入 EXSTART
  device_info:
    model: S9850-32B
    version: Comware 7.1.070 R7625
  evidence:
  - config_snippet: "# Spine\nospf 1 router-id 10.0.0.1\n  area 0.0.0.1    # area id 0.0.0.1\n  network 10.1.1.0 0.0.0.255\n# Leaf\nospf 1 router-id 10.0.0.2\n  area 0.0.0.2    # ⚠️ area id 0.0.0.2 不一致"
  - log_lines:
    - '%OSPF/3/NEIGHBOR_CHANGE(l): Neighbor 10.0.0.1 stayed in Init state'
  question: 诊断 + 修复
expected_output:
  root_causes:
  - rank: 1
    cause: 两端 area-id 不一致（0.0.0.1 vs 0.0.0.2）
    probability: 0.6
    evidence:
    - Init 状态说明收到了 Hello 但其他字段不一致
    verify: 'display ospf peer

      display ospf brief'
    fix: "ospf 1\n  # Leaf 这边统一改 area 0.0.0.1\n  area 0.0.0.1\n  undo area 0.0.0.2"
    rollback: undo area 0.0.0.1
  - rank: 2
    cause: OSPF 认证 MD5 不一致
    probability: 0.25
    verify: display ospf interface | include Authentication
    fix: ospf authentication-mode md5 1 cipher Huawei@2024
  - rank: 3
    cause: Hello/Dead 计时器不一致（H3C 容忍差，但与认证错配易暴露）
    probability: 0.15
    verify: display ospf interface | include Hello
    fix: ospf timer hello 10 dead 40
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/ospf-init
    version: Comware 7.1.070
anti_examples:
- 请重启
- 改 area 0.0.0.0
- 关闭认证
grading_rubric:
  must_have:
  - 诊断 area-id 不一致
  - 修复：统一 area
  nice_to_have:
  - 认证检查
  penalty:
  - 重启
