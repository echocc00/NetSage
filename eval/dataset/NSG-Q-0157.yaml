id: NSG-Q-0157
title: BGP maximum-prefix 超限（思科 IOS-XE 17，邻居被 shutdown）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- bgp
- maximum-prefix
- route-leak
input:
  symptom: '%BGP-5-ADJCHANGE: neighbor 10.1.1.2 Down BGP Notification'
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "router bgp 65001\n neighbor 10.1.1.2 maximum-prefix 5000 80 restart 15\n# 对端发 20000 前缀"
  question: 诊断 maximum-prefix 触发
expected_output:
  root_causes:
  - rank: 1
    cause: 对端路由泄漏超上限
    probability: 0.7
    evidence:
    - 对端发了 20000+ 前缀
    - Notification 触发
    verify: show ip bgp summary | include messages
    fix: prefix-list 限制 + 提高 maximum-prefix 10000 90
  - rank: 2
    cause: restart 计时器未达
    probability: 0.2
    verify: show ip bgp neighbors 10.1.1.2 | include restart
    fix: clear ip bgp 10.1.1.2 soft
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/bgp-maximum-prefix
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
