id: NSG-Q-0086
title: 生成 arista bgp/route_reflector 配置 (iBGP Route Reflector 配置，本地 AS 65000 + 集群 ID 10.0.0.1)
category: config
vendor: arista
version: 4.24+
difficulty: 2
tags:
- bgp
- route_reflector
input:
