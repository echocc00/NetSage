    \ iBGP-RR activate\n    neighbor iBGP-RR route-reflector-client\n    neighbor iBGP-RR next-hop-self\n  !\n\n  neighbor 10.1.1.10 peer-group iBGP-RR\n  neighbor 10.1.1.10 remote-as 65000\n"
  references:
  - type: vendor_doc
    url: https://support.arista.com/bgp-route_reflector
    version: '4.24'
anti_examples:
- 漏 bgp 必要字段
