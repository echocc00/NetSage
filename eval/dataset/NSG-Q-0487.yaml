id: NSG-Q-0487
title: '生成 juniper bgp/route_reflector 配 (变体 #26): Juniper RR cluster_id 10.0.0.10'
category: config
vendor: juniper
version: 8.0+
difficulty: 2
tags:
- bgp
- route_reflector
input:
  symptom: Juniper RR cluster_id 10.0.0.10
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: "set routing-options router-id 10.0.0.10\nset routing-options autonomous-system 65000\nedit groups\n  set protocols bgp group RR type internal\n  set protocols bgp group RR local-address 10.0.0.10\n  set protocols bgp group RR family\
    \ inet unicast\n  set protocols bgp group RR cluster 10.0.0.10\nexit\n\nset protocols bgp group RR neighbor 10.1.1.1\n\nset protocols bgp group RR neighbor 10.1.1.2"
  references:
  - type: vendor_doc
    url: https://juniper.com/bgp-route_reflector
    version: 8.0+
anti_examples:
- 漏 bgp 必要字段
- bgp route_reflector 缩进错乱
grading_rubric:
  must_have:
  - 包含 bgp/route_reflector 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_bgp_route_reflector 必填项
