anti_examples:
- 漏 interface 必要字段
- interface vlan 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 interface/vlan 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 h3c_comware_interface_vlan 必填项
