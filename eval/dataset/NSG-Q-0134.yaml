id: NSG-Q-0134
title: 生成 h3c interface/vlan 配置 (Vlanif 10 配置 + IP)
category: config
vendor: h3c
version: 7.1.070+
difficulty: 2
tags:
- interface
- vlan
input:
  symptom: Vlanif 10 配置 + IP
  device_info:
    model: generic
    version: 7.1.070+
  question: 生成命令
expected_output:
  config: "vlan 10\n  description mgmt\n#\ninterface Vlan-interface10\n  ip address 10.1.10.1 255.255.255.0\n  ip binding vpn-instance public"
  references:
  - type: vendor_doc
    url: https://support.h3c.com/interface-vlan
