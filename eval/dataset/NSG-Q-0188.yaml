id: NSG-Q-0188
title: IPsec Aggressive Mode 协商失败（思科 IOS-XE 17）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 4
tags:
- ipsec
- aggressive
- ikev1
input:
  symptom: IPsec aggressive mode 不通
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "crypto isakmp policy 10\n authentication pre-share"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: 两端 mode 不一致（main vs aggressive）
    probability: 0.85
    evidence: []
    verify: show crypto isakmp policy
    fix: crypto isakmp policy 10 authen pre-share mode aggressive
  - rank: 2
    cause: PSK 不一致
    probability: 0.15
    evidence: []
    verify: show crypto isakmp key
    fix: 对齐 pre-shared-key
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ipsec-aggressive
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ipsec
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
