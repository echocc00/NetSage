id: NSG-Q-0170
title: OSPFv3 卡 EXSTART（思科 17，hello 计时器 错）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ospfv3
- hello
- ipv6
input:
  symptom: OSPFv3 卡 EXSTART
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface g1/0/1\n ipv6 ospf 1 area 0\n ipv6 ospf hello-interval 30   # ⚠️ 不一致\n # 对端默认 10"
  question: 诊断 hello 错
expected_output:
  root_causes:
  - rank: 1
    cause: OSPFv3 计时器必须严格一致（不取 min）
    probability: 0.7
    verify: show ipv6 ospf interface
    fix: ipv6 ospf hello-interval 10
  - rank: 2
    cause: OSPFv3 network-type 错配
    probability: 0.3
    verify: show ipv6 ospf interface | include Network
    fix: 统一 network-type
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ospfv3-hello
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospfv3
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
