id: NSG-Q-0199
title: IPv6 BGP RT 不匹配（思科 IOS-XE 17，route-map 漏配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 4
tags:
- bgp
- ipv6
- route-map
- export
input:
