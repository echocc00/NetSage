id: NSG-Q-0131
title: 生成 arista interface/trunk 配置 (Trunk 端口 VLAN 10 配置)
category: config
vendor: arista
version: 4.24+
difficulty: 2
tags:
- interface
- trunk
input:
  symptom: Trunk 端口 VLAN 10 配置
  device_info:
    model: generic
    version: 4.24+
  question: 生成命令
expected_output:
  config: "interface Ethernet1\n  switchport trunk encapsulation dot1q\n  switchport trunk allowed vlan 10\n\n  switchport trunk native vlan 1\n\n  switchport mode trunk"
  references:
  - type: vendor_doc
    url: https://support.arista.com/interface-trunk
    version: '4.24'
anti_examples:
- 漏 interface 必要字段
- interface trunk 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 interface/trunk 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 arista_eos_interface_trunk 必填项
