id: NSG-Q-0431
title: IPsec 隧道 up 但流量不通（思科 IOS-XE 17，TCP MSS 错配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- ipsec
- mss
- tcp-mss
input:
  symptom: IPsec 隧道正常但 ping 大包失败
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface Tunnel0\n tunnel mode ipsec ipv4\n # ⚠️ 漏 ip tcp adjust-mss 1350"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: Tunnel MSS 没调小
    probability: 0.7
    evidence: []
    verify: show crypto map
    fix: ip tcp adjust-mss 1350
  - rank: 2
    cause: PMTU discovery 配错
    probability: 0.3
    evidence: []
    verify: show crypto isakmp
    fix: 配置 PMTUd
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/ipsec-mss
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ipsec
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
