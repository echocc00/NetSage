id: NSG-Q-0135
title: 生成 juniper interface/vlan 配置 (Vlanif 10 配置 + IP)
category: config
vendor: juniper
version: 21.2+
difficulty: 2
tags:
- interface
- vlan
input:
  symptom: Vlanif 10 配置 + IP
  device_info:
    model: generic
    version: 21.2+
  question: 生成命令
expected_output:
  config: 'set vlans vlan-mgmt vlan-id 10

    set vlans vlan-mgmt description mgmt

    set interfaces irb unit 10 family inet address 10.1.10.1/24

    set vlans vlan-mgmt l3-interface irb.10

    set routing-instances default interface irb.10'
  references:
  - type: vendor_doc
    url: https://support.juniper.com/interface-vlan
    version: '21.2'
anti_examples:
- 漏 interface 必要字段
- interface vlan 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 interface/vlan 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_interface_vlan 必填项
