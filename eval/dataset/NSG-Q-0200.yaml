id: NSG-Q-0200
title: IS-IS 路由 metric 错（华为 VRP-8.180，wide/old metric 错配）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 4
tags:
- isis
- wide-metric
- metric-style
input:
  symptom: IS-IS metric 不一致
  device_info:
    model: ''
    version: VRP-8.180
    interfaces: []
  evidence:
  - config_snippet: "isis 1\n is-level level-2"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: metric-style 默认 narrow 对端 wide 不兼容
    probability: 0.7
    evidence: []
    verify: display isis
    fix: metric-style wide
  - rank: 2
    cause: level 错配
    probability: 0.3
    evidence: []
    verify: display isis peer
    fix: is-level level-2
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-isis-metric
    version: VRP-8.180
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 isis
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
