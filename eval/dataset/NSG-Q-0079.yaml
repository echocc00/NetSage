id: NSG-Q-0079
title: 生成 h3c bgp/peering 配置 (eBGP peer 建立，与对端 AS 65001 互联)
category: config
vendor: h3c
version: 7.0+
difficulty: 2
tags:
- bgp
- peering
input:
  symptom: eBGP peer 建立，与对端 AS 65001 互联
  device_info:
