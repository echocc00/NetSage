id: NSG-Q-0125
title: 生成 juniper vpn/ssl_remote 配置 (SSL VPN 远程接入配置（pool + 用户）)
category: config
vendor: juniper
version: 21.2+
difficulty: 2
tags:
- vpn
- ssl_remote
input:
  symptom: SSL VPN 远程接入配置（pool + 用户）
  device_info:
    model: generic
    version: 21.2+
  question: 生成命令
expected_output:
  config: 'set services ssl termination profile ssl1 server-certificate cert1

    set services ssl initiation profile ssl1 client-certificate cert1

    set access profile ssl1 client c1 group g1 password pw

    set access address-assignment pool p1 family inet network 10.1.10.0/24/24

    set access address-assignment pool p1 family inet range 10.1.10.1 to 10.1.10.254

    set access firewall-family inet dial-in client c1 push-interface ge-0/0/1.0

    set access profile ssl1 address-assignment pool p1

    set access profile ssl1 aaa access-profile aaa1

    set security zones security-zone untrust interfaces ge-0/0/1.0 host-inbound-traffic system-services all

    set security zones security-zone untrust address-book address intranet 10.0.0.0/16

    set security policies from-zone untrust to-zone trust policy pol1 match source-address intranet destination-address any application any

    set security policies from-zone untrust to-zone trust policy pol1 then permit'
  references:
  - type: vendor_doc
    url: https://support.juniper.com/vpn-ssl_remote
    version: '21.2'
anti_examples:
- 漏 vpn 必要字段
- vpn ssl_remote 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 vpn/ssl_remote 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_vpn_ssl_remote 必填项
