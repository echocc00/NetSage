id: NSG-Q-0209
title: DHCP relay 不通（思科 IOS-XE 17，helper address 错配）
category: troubleshoot
vendor: cisco
version: IOS-XE-17.09
difficulty: 3
tags:
- dhcp
- relay
- helper
input:
  symptom: DHCP 客户端获取不到 IP
  device_info:
    model: ''
    version: IOS-XE-17.09
    interfaces: []
  evidence:
  - config_snippet: "interface Vlan10\n ip helper-address 10.1.1.99"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: helper-address 配错 IP
    probability: 0.7
    evidence: []
    verify: show running-config interface vlan10
    fix: ip helper-address 10.1.1.100
  - rank: 2
    cause: DHCP 服务器策略拒绝
    probability: 0.3
    evidence: []
    verify: 测试 DHCP server
    fix: 修 server 配置
  references:
  - type: vendor_doc
    url: https://www.cisco.com/c/en/us/support/dhcp-relay
    version: IOS-XE-17.09
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 dhcp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
