    fix: 补全 peer-vtep 列表
  - rank: 2
    cause: BGP EVPN peer enable 漏配
    probability: 0.3
    evidence: []
    verify: show bgp evpn summary
    fix: 配 BGP EVPN
  references:
  - type: vendor_doc
    url: https://www.arista.com/en/docs/eos-4.24/vxlan-bum
    version: EOS 4.24
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 vxlan
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
