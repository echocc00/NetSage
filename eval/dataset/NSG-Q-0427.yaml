id: NSG-Q-0427
title: VXLAN Type-3 BUM 不通（Arista EOS 4.24，head-end-replication）
category: troubleshoot
vendor: arista
version: '4.24'
difficulty: 4
tags:
- vxlan
- bum
- head-end
input:
  symptom: VXLAN Type-3 路由学习不到
  device_info:
    model: ''
    version: '4.24'
    interfaces: []
  evidence:
  - config_snippet: "interface Vxlan1\n vxlan-unicast-group 10.0.0.2  # static 不全"
  question: 诊断修复
expected_output:
