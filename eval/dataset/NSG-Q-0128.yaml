id: NSG-Q-0128
title: 生成 cisco interface/trunk 配置 (Trunk 端口 VLAN 10 配置)
category: config
vendor: cisco
version: 15.6(3)M+
difficulty: 2
tags:
- interface
- trunk
input:
  symptom: Trunk 端口 VLAN 10 配置
  device_info:
    model: generic
    version: 15.6(3)M+
  question: 生成命令
expected_output:
