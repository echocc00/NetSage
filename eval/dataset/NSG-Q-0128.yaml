  references:
  - type: vendor_doc
    url: https://support.cisco.com/interface-trunk
    version: 15.6(3)M
anti_examples:
- 漏 interface 必要字段
- interface trunk 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 interface/trunk 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 cisco_iosxe_interface_trunk 必填项
