id: NSG-Q-0115
title: 生成 juniper vxlan/anycast_gateway 配置 (VXLAN anycast-gateway VNI 10020，统一网关 MAC)
category: config
vendor: juniper
version: 21.2R1+
difficulty: 2
tags:
- vxlan
- anycast_gateway
input:
  symptom: VXLAN anycast-gateway VNI 10020，统一网关 MAC
  device_info:
    model: generic
    version: 21.2R1+
  question: 生成命令
expected_output:
  config: 'set routing-instances anycast-gw instance-type virtual-switch

    set routing-instances anycast-gw vlan-id 20

    set routing-instances anycast-gw vxlan vni 10020

    set routing-instances anycast-gw routing-interface irb.20

    set routing-instances anycast-gw protocols evpn encapsulation vxlan

    set routing-instances anycast-gw protocols evpn default-gateway do-esi-switching

    !

    set interfaces irb unit 20 family inet address 10.1.20.1/24

    set interfaces irb unit 20 mac 00:00:5e:00:01:20'
  references:
  - type: vendor_doc
    url: https://support.juniper.com/vxlan-anycast_gateway
    version: 21.2R1
anti_examples:
- 漏 vxlan 必要字段
- vxlan anycast_gateway 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 vxlan/anycast_gateway 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 juniper_junos_vxlan_anycast_gateway 必填项
