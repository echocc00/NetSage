  - rank: 2
    cause: PIM-SM 上游配置错
    probability: 0.3
    evidence: []
    verify: display pim bsr
    fix: 配 PIM BSR
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-igmp-querier
    version: VRP-8.180
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 multicast
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
