id: NSG-Q-0447
title: IPv4 Multicast IGMP 漏查询（华为 VRP-8.180）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 4
tags:
- multicast
- igmp
- querier
input:
  symptom: IGMP multicast 终端获取不到
  device_info:
    model: ''
    version: VRP-8.180
    interfaces: []
  evidence:
  - config_snippet: "interface Vlanif10\n igmp enable  # ⚠️ 漏 querier"
