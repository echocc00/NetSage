id: NSG-Q-0087
title: 生成 huawei bgp/ipv6_family 配置 (BGP IPv4+IPv6 双栈配置，对端 v4 peer 10.1.1.1 + v6 peer 2001:db8::2)
category: config
vendor: huawei
version: 8.0+
difficulty: 2
tags:
- bgp
- ipv6_family
input:
  symptom: BGP IPv4+IPv6 双栈配置，对端 v4 peer 10.1.1.1 + v6 peer 2001:db8::2
  device_info:
    model: generic
    version: 8.0+
  question: 生成命令
expected_output:
  config: "bgp 65000\n\n  router-id 10.0.0.1\n\n\n  peer 10.1.1.1 as-number 65001\n\n  #\n  ipv4-family unicast\n\n    peer 10.1.1.1 enable\n\n  #\n  ipv6-family unicast\n\n\n    peer 2001:db8::2 enable\n    peer 2001:db8::2 advertise ipv6 unicast\n"
  references:
  - type: vendor_doc
    url: https://support.huawei.com/bgp-ipv6_family
    version: '8.0'
anti_examples:
- 漏 bgp 必要字段
- bgp ipv6_family 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 bgp/ipv6_family 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 huawei_vrp_bgp_ipv6_family 必填项
