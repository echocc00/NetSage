id: NSG-Q-0191
title: IPv6 Neighbor Discovery 频繁失效（华为 VRP-8.180，nd cache expire 错配）
category: troubleshoot
vendor: huawei
version: VRP-8.180
difficulty: 3
tags:
- ipv6
- nd
- neighbor-cache
input:
  symptom: IPv6 Neighbor cache incomplete 高
  device_info:
    model: ''
    version: VRP-8.180
    interfaces: []
  evidence:
  - config_snippet: "interface 10GE1/0/1\n ipv6 nd cache expire 60"
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: ipv6 nd cache expire 60s 太短
    probability: 0.7
    evidence: []
    verify: display ipv6 neighbors
    fix: ipv6 nd cache expire 14400
  - rank: 2
    cause: IPv6 link-local 频繁变
    probability: 0.3
    evidence: []
    verify: display ipv6 interface
    fix: 配置固定 link-local
  references:
  - type: vendor_doc
    url: https://support.huawei.com/vrp-ipv6-nd
    version: VRP-8.180
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ipv6
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
