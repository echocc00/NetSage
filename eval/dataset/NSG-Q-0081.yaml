  references:
  - type: vendor_doc
    url: https://support.arista.com/bgp-peering
    version: '4.28'
anti_examples:
- 漏 bgp 必要字段
- bgp peering 缩进错乱（应当 cli 风格）
grading_rubric:
  must_have:
  - 包含 bgp/peering 必要段
  nice_to_have:
  - 输入参数与 schema 一致
  penalty:
  - 漏 arista_eos_bgp_peering 必填项
