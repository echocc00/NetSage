id: NSG-Q-0081
title: 生成 arista bgp/peering 配置 (eBGP peer 建立，与对端 AS 65001 互联)
category: config
vendor: arista
version: 4.28+
difficulty: 2
tags:
- bgp
- peering
input:
  symptom: eBGP peer 建立，与对端 AS 65001 互联
  device_info:
    model: generic
    version: 4.28+
  question: 生成命令
expected_output:
