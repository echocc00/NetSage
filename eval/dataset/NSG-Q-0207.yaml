id: NSG-Q-0207
title: BGP RR cluster-list 阻塞（Juniper 21.2，RR 双重 cluster_id）
category: troubleshoot
vendor: juniper
version: 21.2R1
difficulty: 4
tags:
- bgp
- route-reflector
- cluster-id
- loop
input:
  symptom: BGP 路由 RR 之间不互相 ref
  device_info:
    model: ''
    version: 21.2R1
    interfaces: []
  evidence:
  - config_snippet: set protocols bgp group RR-RR cluster 10.0.0.1
  question: 诊断修复
expected_output:
  root_causes:
  - rank: 1
    cause: 同 cluster-id 导致 route reflect 死循环
    probability: 0.7
    evidence: []
    verify: show bgp neighbor
    fix: cluster 0.0.0.1
  - rank: 2
    cause: originator-id 不一致
    probability: 0.3
    evidence: []
    verify: show route protocol bgp
    fix: 配 originator-id
  references:
  - type: vendor_doc
    url: https://www.juniper.net/documentation/junos-21.2/bgp-cluster
    version: 21.2R1
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 bgp
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
