id: NSG-Q-0116
title: 生成 arista vxlan/anycast_gateway 配置 (VXLAN anycast-gateway VNI 10020，统一网关 MAC)
category: config
vendor: arista
version: 4.24+
difficulty: 2
tags:
- vxlan
- anycast_gateway
input:
