id: NSG-Q-0166
title: OSPF 卡 2-way（H3C Comware 7，priority 错配 + 子网掩码）
category: troubleshoot
vendor: h3c
version: Comware-7.1.070
difficulty: 3
tags:
- ospf
- two-way
- priority
- mask
input:
  symptom: OSPF 卡 2-way
  device_info:
    model: ''
    version: Comware-7.1.070
    interfaces: []
  evidence:
  - config_snippet: "int 40GE1/0/1\n ospf 1 area 0\n ospf network-type broadcast\n ospf dr-priority 0  # ⚠️ priority 0\n# 对端 dr-priority 100"
  question: 诊断 2-way 卡死
expected_output:
  root_causes:
  - rank: 1
    cause: 本端 priority 0 + broadcast 网络类型组合，导致 DROther 关系正常但不形成 FULL
    probability: 0.6
    verify: display ospf peer
    fix: ospf dr-priority 100
  - rank: 2
    cause: 两端接口子网掩码不一致
    probability: 0.4
    verify: display ip interface brief
    fix: 对齐掩码
  references:
  - type: vendor_doc
    url: https://www.h3c.com/cn/d_202206/ospf-two-way
    version: Comware 7.1.070
anti_examples:
- 请重启设备
- 删除进程
- 推荐全局清除配置
grading_rubric:
  must_have:
  - top 根因为 ospf
  - ≥1 验证命令
  - ≥1 修复命令
  nice_to_have:
  - 含 rollback
  penalty:
  - 推荐重启
