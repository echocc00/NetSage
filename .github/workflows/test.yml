name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit -q --no-cov

      - name: E2E tests
        run: pytest tests/e2e -q --no-cov

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  eval-dataset:
    name: Eval dataset schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate 513 questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from eval.runner.schema import validate_dataset
          passed, total, errors = validate_dataset(Path("eval/dataset"))
          print(f"schema: {passed}/{total} passed, {len(errors)} errors")
          for e in errors[:10]:
              print(" ", e)
          sys.exit(0 if passed == total else 1)
          PY

      - name: Quality review (no schema fail / no true dupes)
        run: python eval/runner/review_dataset.py

  templates:
    name: Config templates render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Render all 86 templates
        run: pytest tests/unit/test_templates_full.py -q --no-cov

  cli:
    name: CLI nsc (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install nsc
        run: pip install -e "cli/nsc[test]"

      - name: Run CLI tests
        run: pytest cli/nsc/tests -q --no-cov

  keycloak:
    name: Keycloak SSO E2E (real provider)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Start Keycloak
        run: docker compose -f ../infra/docker-compose.keycloak.yml up -d

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Provision Keycloak
        run: python scripts/provision_keycloak.py

      - name: Run real-provider SSO E2E
        run: pytest tests/integration/test_keycloak_e2e.py -q --no-cov

  db-integration:
    name: DB integration (postgres + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: netsage
          POSTGRES_PASSWORD: changeme_dev_only
          POSTGRES_DB: netsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://netsage:changeme_dev_only@localhost:5432/netsage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run migrations (0001 → head)
        run: alembic upgrade head

      - name: DB mode integration tests (change store / audit chain / RAG)
        run: pytest tests/integration/test_db_mode.py tests/integration/test_rag_integration.py -q --no-cov

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: netsage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: netsage-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
